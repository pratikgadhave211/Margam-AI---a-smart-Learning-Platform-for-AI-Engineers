version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: margam_db
    environment:
      POSTGRES_USER: margam_user
      POSTGRES_PASSWORD: margam_password
      POSTGRES_DB: margam_ai
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
